<div class="p-6 sm:p-8 max-w-md">
	<h4
		class="dialog-box-title text-lg font-semibold text-app-fg tracking-tight"
		[innerHTML]="confirm.title"></h4>
	@if (noticeBanner) {
		<div
			class="mt-4 rounded-xl border px-4 py-3 text-sm flex gap-3 items-start shadow-sm"
			[ngClass]="
				noticeBanner.tone === 'amber'
					? 'border-amber-500/35 bg-amber-500/10 text-amber-100'
					: 'border-red-500/35 bg-red-500/10 text-red-100'
			">
			<i
				class="fa-solid fa-triangle-exclamation mt-0.5 shrink-0 opacity-90"
				aria-hidden="true"></i>
			<p class="leading-relaxed">{{ noticeBanner.body }}</p>
		</div>
	}
	<div
		[class.mt-4]="!noticeBanner"
		[class.mt-3]="noticeBanner"
		[style.min-height]="messageMinHeight">
		<div
			class="text-sm text-app-muted leading-relaxed [&_a]:text-blue-400 [&_a]:underline"
			style="white-space: pre-wrap"
			[innerHTML]="confirm.message"></div>
		@if (confirm.showPrompt) {
			<input
				type="text"
				name="dialogPrompt"
				[(ngModel)]="promptModel"
				[placeholder]="confirm.promptPlaceholder"
				autofocus
				class="mt-5 w-full rounded-xl border border-app-border-soft bg-app-page px-3 py-2 text-sm text-app-fg placeholder:text-app-muted focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
		}
	</div>
	<div
		class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:items-center"
		[ngClass]="{
			'justify-center text-center': confirm.hideCancel || confirm.hideConfirm,
			'sm:justify-end': !confirm.hideCancel && !confirm.hideConfirm,
		}">
		@if (!confirm.hideCancel) {
			<button
				type="button"
				data-dialog-action="cancel"
				(click)="onCancel()"
				class="btn rounded-xl border border-app-border-soft px-4 py-2.5 text-sm font-medium text-app-subtle hover:bg-app-raised transition-colors">
				{{ confirm.cancelLabel }}
			</button>
		}
		@if (!confirm.hideConfirm) {
			<button
				#confirmBtn
				type="button"
				data-dialog-action="confirm"
				(click)="onConfirm()"
				[class]="primaryButtonClass">
				{{ confirm.confirmLabel }}
			</button>
		}
	</div>
</div>
